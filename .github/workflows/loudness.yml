name: loudness
# Misst die integrierte Lautheit (EBU R128, LUFS) je Moment-Fenster. Auftrag in jobs/loudness.json:
# [{"id":"<hash>","audio":"<url>","windows":[[start,end],...]}]
# Je Fenster nur der Ausschnitt start bis end (ffmpeg -ss/-t, ebur128), nicht die ganze Datei.
# Ergebnis je Quelle als Artefakt "loud-<id>" mit <id>.json: {"id":..,"results":[{"start":..,"end":..,"lufs":-18.3|null,"err":".."}]} und stats.json.
# lufs ist null, wenn die Messung scheitert, das Fenster zu kurz ist oder nur Stille liegt (-70 LUFS oder darunter).
# Klangmerkmale (v1, gleicher ffmpeg-Durchgang, nur Zahlen): je Ergebnis zusätzlich "sound":{"noise":dBFS (10. Perzentil des RMS in Blöcken zu 0,1 s),
# "snr":dB (90. minus 10. Perzentil), "clip":Anteil der Samples über -0,5 dBFS (Mono-Mix), "peak":dBFS, "bw":Hz unter denen 99 % der Energie liegen,
# "bw95":dito 95 %, "hf":Energieanteil über 4 kHz, "blocks":Anzahl Blöcke, "v":2}. Fehlt sound, nennt sErr den Grund.
# v2: Blöcke mit RMS unter -80 dBFS (digitale Stille) zählen für noise und snr nicht, "silent" ist ihr Anteil, "kept" die Zahl der übrigen Blöcke. Bleiben
# weniger als 50 Blöcke, fehlen noise und snr. "flat":Anteil der Samples, die das dritte oder spätere in einer Folge von Samples über -0,5 dBFS sind (abgeflachte
# Spitzen wie bei Übersteuerung, ein Begrenzer ohne Verzerrung erzeugt kaum solche Folgen), "clip" bleibt der Anteil aller Samples über -0,5 dBFS. Alte Auswerter lesen nur lufs und start/end.
on:
  push:
    branches: [claude/compute]
    paths: ['jobs/loudness.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          jobs = json.load(open('jobs/loudness.json'))
          print('matrix=' + json.dumps({'include': [{'id': j['id'], 'audio': j['audio'], 'windows': json.dumps(j['windows'])} for j in jobs]}))
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Werkzeuge
        run: |
          # bis zu dreimal, ein einzelner Fehler von apt-get (Exit 100) soll nicht den ganzen Auftrag kosten
          for i in 1 2 3; do command -v ffmpeg >/dev/null && break; sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && break; sleep 10; done
          command -v ffmpeg >/dev/null
      - name: Fenster messen
        env:
          AUDIO: ${{ matrix.audio }}
          WINDOWS: ${{ matrix.windows }}
        run: |
          mkdir -p work
          cat > measure.py <<'PYEOF'
          #!/usr/bin/env python3
          """Integrierte Lautheit und Klangmerkmale je Fenster. ffmpeg liest nur start bis end (Suchen per -ss vor -i, Dauer per -t) und zerlegt das
          Signal in einem Durchgang in vier Zweige. Zweig 1: ebur128 (Lautheit, unverändert wie vor v1, Zusammenfassung "I: -18.3 LUFS", Ausgang des Graphen). Zweig 2: Mono-Mix in Blöcken
          zu 0,1 s, astats je Block (RMS und Spitze). Zweig 3: Mono-Mix, aeval setzt jedes Sample mit Betrag über 0,944 (-0,5 dBFS) auf 1, sonst 0, astats RMS
          darüber ergibt den Anteil. Zweig 4: Mono-Mix, acrossover in 13 Frequenzbänder, astats RMS je Band über das ganze Fenster (Energie je Band).
          Zweig 5: Mono-Mix, aeval zählt mit st/ld die Länge der laufenden Folge von Samples über -0,5 dBFS und setzt 1, wenn sie 3 erreicht oder überschreitet, astats RMS ergibt den Anteil (flat).
          Schlägt der Durchgang mit den Klangzweigen fehl, läuft der alte Aufruf (nur ebur128), dann fehlt nur sound und der Grund steht in sErr."""
          import json, math, os, re, shutil, subprocess, sys, tempfile, time

          audio, out, job_id = os.environ['AUDIO'], sys.argv[1], sys.argv[2]
          windows = json.loads(os.environ['WINDOWS'])
          I_RE = re.compile(r'Integrated loudness:\s+I:\s+(-?inf|-?[\d.]+) LUFS')

          RATE = 44100
          BLOCK = int(RATE * 0.1)                     # 0,1 s je Block
          CLIP_LEVEL = 10 ** (-0.5 / 20)              # -0,5 dBFS
          SPLITS = [250, 500, 1000, 2000, 3000, 4000, 5000, 6000, 8000, 10000, 12000, 16000]
          EDGES = [0] + SPLITS + [RATE // 2]          # 13 Bänder
          FLOOR_DB = -90.0                            # digitale Stille in Blöcken zählt als -90 dBFS
          SILENT_DB = -80.0                           # Blöcke darunter (digitale Stille, Rauschtor) zählen für noise und snr nicht
          MIN_KEPT = 50                               # weniger übrige Blöcke (5 s): kein noise, kein snr


          def graph():
              bands = ''.join(f'[o{i}]' for i in range(len(SPLITS) + 1))
              stat = 'astats=metadata=1:reset=0:measure_perchannel=none:measure_overall=RMS_level'
              mono = f'aformat=sample_rates={RATE}:channel_layouts=mono'
              parts = [
                  'asplit=5[a1][a2][a3][a4][a5]',
                  '[a1]ebur128=peak=none',
                  f'[a2]{mono},asetnsamples=n={BLOCK}:p=0,astats=metadata=1:reset=1:measure_perchannel=none:measure_overall=RMS_level+Peak_level+Number_of_samples,'
                  'ametadata=mode=print:file=blk.txt,anullsink',
                  f"[a3]{mono},aeval=exprs='gt(abs(val(0))\\,{CLIP_LEVEL:.6f})':channel_layout=mono,{stat},ametadata=mode=print:key=lavfi.astats.Overall.RMS_level:file=clip.txt,anullsink",
                  f"[a5]{mono},aeval=exprs='st(0\\,if(gt(abs(val(0))\\,{CLIP_LEVEL:.6f})\\,ld(0)+1\\,0));gt(ld(0)\\,2)':channel_layout=mono,{stat},ametadata=mode=print:key=lavfi.astats.Overall.RMS_level:file=flat.txt,anullsink",
                  f"[a4]{mono},acrossover=split='{' '.join(map(str, SPLITS))}':order=4th{bands}",
              ]
              parts += [f'[o{i}]{stat},ametadata=mode=print:key=lavfi.astats.Overall.RMS_level:file=band{i}.txt,anullsink' for i in range(len(SPLITS) + 1)]
              return ';'.join(parts)


          def last_db(path):
              """Letzter Wert lavfi.astats.Overall.RMS_level in einer ametadata-Datei (kumuliert über das Fenster), -inf als None"""
              v = None
              for line in open(path, encoding='utf8', errors='replace'):
                  if line.startswith('lavfi.astats.Overall.RMS_level='):
                      v = line.split('=', 1)[1].strip()
              if v is None:
                  raise ValueError(f'{path}: kein Wert')
              return None if 'inf' in v else float(v)


          def pct(xs, p):
              """Perzentil mit linearer Interpolation (wie numpy.percentile)"""
              xs = sorted(xs)
              k = (len(xs) - 1) * p / 100
              lo, hi = int(math.floor(k)), int(math.ceil(k))
              return xs[lo] + (xs[hi] - xs[lo]) * (k - lo)


          def read_blocks(path):
              """Blöcke (rms, peak, samples) aus blk.txt"""
              blocks, cur = [], {}
              for line in open(path, encoding='utf8', errors='replace'):
                  line = line.strip()
                  if line.startswith('frame:'):
                      if cur:
                          blocks.append(cur)
                      cur = {}
                  elif '=' in line:
                      k, v = line.split('=', 1)
                      cur[k.replace('lavfi.astats.Overall.', '')] = v
              if cur:
                  blocks.append(cur)
              num = lambda s: FLOOR_DB if 'inf' in s else float(s)
              return [(max(FLOOR_DB, num(b['RMS_level'])), num(b['Peak_level']), int(float(b['Number_of_samples']))) for b in blocks if {'RMS_level', 'Peak_level', 'Number_of_samples'} <= b.keys()]


          def sound_from(wd):
              blocks = [b for b in read_blocks(os.path.join(wd, 'blk.txt')) if b[2] >= BLOCK // 2]  # kurzen Schlussblock auslassen
              if len(blocks) < 5:
                  raise ValueError(f'nur {len(blocks)} Blöcke')
              rms = [b[0] for b in blocks if b[0] >= SILENT_DB]
              silent = 1 - len(rms) / len(blocks)
              noise_snr = {}
              if len(rms) >= MIN_KEPT:
                  noise, speech = pct(rms, 10), pct(rms, 90)
                  noise_snr = {'noise': round(noise, 1), 'snr': round(speech - noise, 1)}
              cl = last_db(os.path.join(wd, 'clip.txt'))
              clip = 0.0 if cl is None else min(1.0, 10 ** (cl / 10))   # mittleres Quadrat eines 0/1-Signals ist der Anteil
              fl = last_db(os.path.join(wd, 'flat.txt'))
              flat = 0.0 if fl is None else min(1.0, 10 ** (fl / 10))
              pw = []
              for i in range(len(SPLITS) + 1):
                  d = last_db(os.path.join(wd, f'band{i}.txt'))
                  pw.append(0.0 if d is None else 10 ** (d / 10))
              tot = sum(pw)
              if tot <= 0:
                  raise ValueError('keine Bandenergie')

              def bw(share):
                  acc = 0.0
                  for i, p in enumerate(pw):
                      if acc + p >= share * tot:
                          f = (share * tot - acc) / p if p > 0 else 0.0
                          return EDGES[i] + f * (EDGES[i + 1] - EDGES[i])
                      acc += p
                  return float(EDGES[-1])

              return {**noise_snr, 'clip': round(clip, 5), 'flat': round(flat, 6), 'silent': round(silent, 3), 'kept': len(rms), 'peak': round(max(b[1] for b in blocks), 1),
                      'bw': round(bw(0.99)), 'bw95': round(bw(0.95)), 'hf': round(sum(pw[6:]) / tot, 4), 'blocks': len(blocks), 'v': 2}


          def run(cmd, wd=None):
              return subprocess.run(cmd, capture_output=True, timeout=600, cwd=wd)


          def measure(start, end):
              dur = str(round(end - start, 3))
              # -t vor -i begrenzt die Eingabe, damit alle Zweige dasselbe Fenster sehen (als Ausgabeoption begrenzte es nur den Zweig mit dem Ausgang)
              head = ['ffmpeg', '-hide_banner', '-nostats', '-nostdin', '-ss', str(start), '-t', dur, '-i', audio, '-vn']
              base = ['ffmpeg', '-hide_banner', '-nostats', '-nostdin', '-ss', str(start), '-i', audio, '-t', dur, '-vn']  # wie vor v1
              err, serr = '', None
              for attempt in range(3):
                  wd = tempfile.mkdtemp(prefix='snd')
                  try:
                      try:
                          # Bytes lesen und tolerant dekodieren: ID3-Tags enthalten manchmal kein UTF-8
                          r = run(head + ['-af', graph(), '-f', 'null', '-'], wd)
                      except subprocess.TimeoutExpired:
                          err = 'timeout'
                          continue
                      except Exception as ex:  # ein Fenster darf nie den ganzen Auftrag abbrechen
                          err = f'{type(ex).__name__}: {ex}'[:160]
                          continue
                      stderr = r.stderr.decode('utf-8', errors='replace')
                      m = I_RE.search(stderr)
                      if m:
                          v = m.group(1)
                          if 'inf' in v:
                              return None, 'silence', None, None
                          x = float(v)
                          # -70 LUFS ist die Untergrenze des Messgeräts: Stille
                          if x <= -69.9:
                              return None, 'silence', None, None
                          try:
                              return round(x, 1), '', sound_from(wd), None
                          except Exception as ex:
                              return round(x, 1), '', None, f'{type(ex).__name__}: {ex}'[:160]
                      err = (stderr.strip().splitlines() or ['no output'])[-1][:160]
                      serr = err
                  finally:
                      shutil.rmtree(wd, ignore_errors=True)
                  time.sleep(2 * (attempt + 1))
              # Rückfall: der alte Aufruf nur mit ebur128, damit die Lautheit nie an den Klangzweigen scheitert
              try:
                  r = run(base + ['-af', 'ebur128=peak=none', '-f', 'null', '-'])
                  m = I_RE.search(r.stderr.decode('utf-8', errors='replace'))
                  if m and 'inf' not in m.group(1) and float(m.group(1)) > -69.9:
                      return round(float(m.group(1)), 1), '', None, f'graph: {serr or err}'[:160]
              except Exception as ex:
                  err = f'{type(ex).__name__}: {ex}'[:160]
              return None, err, None, None


          res, ok, snd = [], 0, 0
          for s, e in windows:
              if e - s < 1.0:
                  res.append({'start': s, 'end': e, 'lufs': None, 'err': 'too short'})
                  continue
              v, err, sound, serr = measure(s, e)
              ok += v is not None
              snd += sound is not None
              res.append({'start': s, 'end': e, 'lufs': v, **({'err': err} if err else {}), **({'sound': sound} if sound else {}), **({'sErr': serr} if serr else {})})
              print(s, e, v, err, sound, serr)
          json.dump({'id': job_id, 'results': res}, open(out, 'w'))
          json.dump({'id': job_id, 'windows': len(windows), 'measured': ok, 'sound': snd}, open(os.path.join(os.path.dirname(out), 'stats.json'), 'w'))
          print(f'{ok} von {len(windows)} Fenstern gemessen, Klang bei {snd}')
          PYEOF
          python3 measure.py work/${{ matrix.id }}.json ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loud-${{ matrix.id }}
          path: work/*.json
          retention-days: 3
