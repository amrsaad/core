name: probe
on:
  push:
    branches: [claude/probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B='https://www.ebi.ac.uk/europepmc/webservices/rest/search'
          t() { echo "== $1"; curl -s -o /tmp/r -w '%{http_code}\n' "$2"; head -c 300 /tmp/r; echo; }
          t plain "$B?query=glaucoma&format=json&pageSize=2"
          t core "$B?query=glaucoma&format=json&pageSize=2&resultType=core"
          t sortD "$B?query=glaucoma&format=json&pageSize=2&sort=FIRST_PDATE_D"
          t sortDesc "$B?query=glaucoma&format=json&pageSize=2&sort=FIRST_PDATE%20desc"
          t pdate "$B?query=glaucoma%20AND%20FIRST_PDATE:%5B2026-09-23%20TO%202026-10-23%5D&format=json&pageSize=2"
          t journal "$B?query=JOURNAL:%22Ophthalmology%22%20AND%20glaucoma&format=json&pageSize=2"
          t hasabs "$B?query=glaucoma%20AND%20HAS_ABSTRACT:y&format=json&pageSize=2"
          t pubtype "$B?query=glaucoma%20AND%20PUB_TYPE:%22review%22&format=json&pageSize=2"
          t cursor "$B?query=glaucoma&format=json&pageSize=2&cursorMark=*"
          t core50 "$B?query=glaucoma&format=json&pageSize=50&resultType=core&cursorMark=*"
          curl -s "$B?query=JOURNAL:%22Ophthalmology%22%20AND%20glaucoma%20AND%20HAS_ABSTRACT:y&format=json&pageSize=1&resultType=core" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d['resultList']['result'][0];print({k:(str(v)[:200]) for k,v in r.items() if k in ('id','source','pmid','doi','title','abstractText','pubYear','firstPublicationDate','journalInfo','pubTypeList')})"
          echo "== arxiv"
          curl -s -o /tmp/a -w '%{http_code}\n' 'https://export.arxiv.org/api/query?search_query=cat:cs.AI&max_results=2'; head -c 600 /tmp/a; echo
          sleep 5
          curl -s -o /tmp/a -w '%{http_code}\n' 'http://export.arxiv.org/api/query?search_query=cat:cs.AI+OR+cat:cs.CL&sortBy=submittedDate&max_results=2'; head -c 300 /tmp/a
          curl -s -o /dev/null -w 'rss %{http_code}\n' 'https://rss.arxiv.org/atom/cs.AI'
