name: preview

# Vorschau-Kanal (Entscheidung 56, Brief 21). Ein Push auf den Branch `preview` baut den Stand nach /core/preview/
# und liefert ihn mit der echten App zusammen aus: die echte App wird frisch aus dem Default-Branch gebaut und bleibt unter /core/.
# Keine Tests. Die Freigabe läuft weiter über daily.yml auf dem Hauptbranch (Regel 55).
# Ziel: Push bis Handy unter 6 Minuten.
on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# Der neueste Push gewinnt
concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: prod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prod/package-lock.json

      - name: Vorschau bauen (/core/preview/)
        run: |
          npm ci
          CORE_BASE=/core/preview/ npm run build
          test -f dist/preview/index.html

      - name: Echte App bauen (/core/, Stand des Default-Branches)
        working-directory: prod
        run: |
          node ../scripts/prod-guard.mjs vite.config.ts
          npm ci
          npm run build
          test -f dist/index.html
          grep -q 'preview' dist/sw.js || echo "::warning::Service-Worker der echten App enthält keine Ausnahme für /core/preview/"

      - name: Zusammenführen (echte App unter /, Vorschau unter /preview/)
        run: |
          mkdir site
          cp -a prod/dist/. site/
          rm -rf site/preview
          cp -a dist/preview site/preview
          echo "prod  $(git -C prod rev-parse --short HEAD)"
          echo "preview  $(git rev-parse --short HEAD)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
