name: daily

# Läuft immer auf dem Default-Branch des Repos (Name egal).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed-Lauf (5 Jahre fact, 30 Tage fresh, 66 Verse)'
        type: boolean
        default: false
  push:

permissions:
  contents: write
  pages: write
  id-token: write

# Der neueste Push gewinnt: ein hängender oder überholter Lauf wird abgebrochen, sonst staut sich der Deploy (30.10.2026)
concurrency:
  group: daily
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ffmpeg misst im Lautheits-Test (tests/moments-loudness.test.ts) die Fixtures. Ohne ffmpeg würde der Test still übersprungen.
      - name: ffmpeg für den Lautheits-Test
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: npm test
      - run: npm run build

  pipeline:
    needs: test
    # Push startet die Pipeline nur mit [seed], [pipeline] oder [video-seed] in der Commit-Nachricht
    if: >-
      github.ref_name == github.event.repository.default_branch && (
        github.event_name != 'push' ||
        contains(github.event.head_commit.message, '[seed]') ||
        contains(github.event.head_commit.message, '[pipeline]') ||
        contains(github.event.head_commit.message, '[video-seed]'))
    env:
      SEED: ${{ (inputs.seed || contains(github.event.head_commit.message, '[seed]')) && '--seed' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Video-Pipeline zuerst. Fehler in einem Teil verhindern nicht den Commit des anderen.
      - name: Videos (Kanäle auflösen, Shorts holen, Pool ergänzen)
        id: videos
        continue-on-error: true
        run: npx tsx pipeline/video/run.ts ${{ contains(github.event.head_commit.message, '[video-seed]') && '--seed' || '' }}
      - name: Karten holen
        id: fetch
        continue-on-error: true
        run: npx tsx pipeline/fetch/all.ts $SEED
      - name: Karten bauen und prüfen
        id: cards
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: npx tsx pipeline/build.ts $SEED
      - name: Gesamtbestand erneut prüfen
        id: verify
        if: steps.cards.outcome == 'success'
        continue-on-error: true
        run: npm run verify
      - name: Rejected-Log bei Fehler sichern
        if: steps.cards.outcome == 'failure' || steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-out
          path: pipeline/out
      - name: Ein Commit für neue Videos und Karten
        run: |
          git config user.name "core-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.cards.outcome }}" = "success" ] && [ "${{ steps.verify.outcome }}" = "success" ]; then
            # index.json ändert updatedAt bei jedem Lauf, zählt daher nicht als neue Karte
            if ! git diff --quiet -- public/cards ':!public/cards/index.json' || [ -n "$(git ls-files --others --exclude-standard public/cards)" ]; then
              git add public/cards pipeline/raw pipeline/out pipeline/state.json
            fi
          fi
          if [ "${{ steps.videos.outcome }}" = "success" ]; then
            git add public/videos content/channels.json
          fi
          if git diff --cached --quiet; then
            echo "Nichts Neues."
            exit 0
          fi
          videos=$(node -p "require('./public/videos/pool.json').videos.length" 2>/dev/null || echo 0)
          cards=$(node -p "require('./public/cards/index.json').total")
          git commit -m "content: $(date -u +%F) (${videos} Videos, ${cards} Karten)"
          # Ein gleichzeitiger Push (Content-Bot, Entwicklung) darf den Schritt nicht rot machen
          for i in 1 2 3 4 5; do
            # Zwei Läufe am selben Tag legen dieselben Rohdateien an (add/add). Dann gilt der Stand auf dem Branch.
            if ! git pull --rebase -q -X theirs origin "${{ github.ref_name }}"; then
              git checkout --theirs -- . 2>/dev/null || true
              git add -A && GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          echo "Push nach 5 Versuchen fehlgeschlagen" >&2
          exit 1
      - name: Teilfehler melden
        if: steps.videos.outcome == 'failure' || steps.fetch.outcome == 'failure' || steps.cards.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: |
          echo "::error::Teilfehler: videos=${{ steps.videos.outcome }} fetch=${{ steps.fetch.outcome }} cards=${{ steps.cards.outcome }} verify=${{ steps.verify.outcome }}"
          exit 1

  # E2E (nachgebaute YouTube-API, WebKit und Chromium) bei jedem Lauf. Deploy nur nach grünem E2E (Max, 26.10.2026).
  # Ergebnisse und Screenshots werden committet. Ausgabe sha = der getestete Stand, genau der wird deployt.
  e2e:
    needs: [test, pipeline]
    if: always() && needs.test.result == 'success' && needs.pipeline.result != 'cancelled'
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    runs-on: ubuntu-latest
    # Die E2E-Schritte summieren sich auf rund 150 Minuten Höchstdauer, 45 waren seit heute zu knapp (jeder Lauf lief in den Timeout)
    timeout-minutes: 150
    # Offizielles Image: Browser und Systempakete sind vorinstalliert (apt-Installation hing im Runner)
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - name: Momente-Feed testen (nachgebaute YouTube-API, WebKit und Chromium)
        timeout-minutes: 12
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4173/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/moments.mjs http://127.0.0.1:4173/core/ pipeline/out/e2e-moments
      - name: Desktop-Modus testen (Chromium 1440x900, jede Taste, Panel, Trackpad, PWA)
        if: always()
        timeout-minutes: 10
        run: |
          npx vite preview --host 127.0.0.1 --port 4175 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4175/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/desktop.mjs http://127.0.0.1:4175/core/ pipeline/out/e2e-desktop
      - name: Schlüsselsicherung testen (3 Läufe je Browser, alle müssen grün sein)
        if: always()
        timeout-minutes: 8
        run: |
          npx vite preview --host 127.0.0.1 --port 4174 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4174/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          RUNS=3 node tests/e2e/keyrestore.mjs http://127.0.0.1:4174/core/ pipeline/out/e2e-keyrestore
      - name: Geräte-Sync testen (nachgebaute GitHub API, zwei Geräte, WebKit und Chromium)
        if: always()
        timeout-minutes: 10
        run: |
          npx vite preview --host 127.0.0.1 --port 4176 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4176/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/sync.mjs http://127.0.0.1:4176/core/ pipeline/out/e2e-sync
      - name: Core Digest testen (Wochenkarte, Taps, zweites Gerät, nachgebaute GitHub API, WebKit und Chromium)
        if: always()
        timeout-minutes: 10
        run: |
          npx vite preview --host 127.0.0.1 --port 4177 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4177/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/digest.mjs http://127.0.0.1:4177/core/ pipeline/out/e2e-digest
      - name: Hintergrund-Wiedergabe testen (Audio läuft weiter, Video bis zum Ende, YouTube hält an; WebKit und Chromium)
        if: always()
        timeout-minutes: 8
        run: |
          npx vite preview --host 127.0.0.1 --port 4178 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4178/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/background.mjs http://127.0.0.1:4178/core/ pipeline/out/e2e-background
      - name: Offline-Vorrat testen (gedrosseltes Netz 1,5 s, Start aus dem Cache unter 100 ms, offline, Chromium)
        if: always()
        timeout-minutes: 8
        run: |
          npx vite preview --host 127.0.0.1 --port 4179 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4179/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/preload.mjs http://127.0.0.1:4179/core/ pipeline/out/e2e-preload
      - name: Endseite testen (gesehen bleibt gesehen, Zahlen der anderen Reiter, Abrufkarte vor der Endseite)
        if: always()
        timeout-minutes: 6
        run: |
          npx vite preview --host 127.0.0.1 --port 4180 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4180/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/endpage.mjs http://127.0.0.1:4180/core/ pipeline/out/e2e-endpage
      - name: Wischübergang messen (10 Wische, verlorene Frames, Ziel unter 2 Prozent; WebKit relativ zum Leerlauf-Boden des Runners)
        if: always()
        timeout-minutes: 8
        run: |
          npx vite preview --host 127.0.0.1 --port 4181 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4181/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/swipe.mjs http://127.0.0.1:4181/core/ pipeline/out/e2e-swipe
      - name: Gleiche Lautheit testen (GainNode je Moment, YouTube nur absenken, kein CORS und HLS unverändert, Settings-Diagnose; Chromium)
        if: always()
        timeout-minutes: 6
        run: |
          npx vite preview --host 127.0.0.1 --port 4182 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4182/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          E2E_BROWSERS=chromium node tests/e2e/loudness.mjs http://127.0.0.1:4182/core/ pipeline/out/e2e-loudness
      - name: Netzabbruch testen (5, 20 und 60 s offline mitten im Abspielen, Streams und YouTube, WebKit und Chromium)
        if: always()
        timeout-minutes: 14
        run: |
          npx vite preview --host 127.0.0.1 --port 4183 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4183/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/offline.mjs http://127.0.0.1:4183/core/ pipeline/out/e2e-offline
      - name: Tempo testen (langes Drücken, Anzeige, Reiter, Settings, Neustart, Streams und YouTube, WebKit und Chromium)
        if: always()
        timeout-minutes: 8
        run: |
          npx vite preview --host 127.0.0.1 --port 4184 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4184/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/tempo.mjs http://127.0.0.1:4184/core/ pipeline/out/e2e-tempo
      - name: Tempo flüssig testen (Issue 13, echte Wiedergabe, Stalls, Netzanfragen beim Wechsel, Elemente mit Quelle; Chromium mit CPU-Drossel 4x; WebKit läuft auf dem Runner unter Last instabil und bleibt eine manuelle Messung)
        if: always()
        timeout-minutes: 20
        run: |
          npx vite preview --host 127.0.0.1 --port 4186 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4186/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          E2E_BROWSERS=chromium CHECK=1 node tests/e2e/tempoperf.mjs http://127.0.0.1:4186/core/ pipeline/out/e2e-tempoperf
      - name: Abrufkarten-Warteschlange testen (Settings, Saved, Feedback-Blatt, Hintergrund; WebKit und Chromium)
        if: always()
        timeout-minutes: 8
        run: |
          npx vite preview --host 127.0.0.1 --port 4185 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4185/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/recallqueue.mjs http://127.0.0.1:4185/core/ pipeline/out/e2e-recallqueue
      - name: Audio-Reiter testen (Issue 11, 13, 14, 15; erste Geste, Hintergrund, Abrufkarte, Tempo 2x, Untertitel; WebKit und Chromium)
        if: always()
        timeout-minutes: 12
        run: |
          npx vite preview --host 127.0.0.1 --port 4187 --strictPort &
          node -e "(async()=>{for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:4187/core/')).ok)return}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)})()"
          node tests/e2e/audiotab.mjs http://127.0.0.1:4187/core/ pipeline/out/e2e-audiotab
      - name: Ergebnisse committen
        if: always()
        run: |
          [ -d pipeline/out/e2e-loudness ] || [ -d pipeline/out/e2e-moments ] || [ -d pipeline/out/e2e-keyrestore ] || [ -d pipeline/out/e2e-desktop ] || [ -d pipeline/out/e2e-sync ] || [ -d pipeline/out/e2e-digest ] || [ -d pipeline/out/e2e-background ] || [ -d pipeline/out/e2e-preload ] || [ -d pipeline/out/e2e-endpage ] || [ -d pipeline/out/e2e-swipe ] || [ -d pipeline/out/e2e-offline ] || [ -d pipeline/out/e2e-tempo ] || [ -d pipeline/out/e2e-tempoperf ] || [ -d pipeline/out/e2e-recallqueue ] || [ -d pipeline/out/e2e-audiotab ] || { echo "Keine E2E-Ergebnisse."; exit 0; }
          git config user.name "core-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/out/e2e-loudness pipeline/out/e2e-moments pipeline/out/e2e-keyrestore pipeline/out/e2e-desktop pipeline/out/e2e-sync pipeline/out/e2e-digest pipeline/out/e2e-background pipeline/out/e2e-preload pipeline/out/e2e-endpage pipeline/out/e2e-swipe pipeline/out/e2e-offline pipeline/out/e2e-tempo pipeline/out/e2e-tempoperf pipeline/out/e2e-recallqueue pipeline/out/e2e-audiotab 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "e2e: Momente-Feed $(date -u +%FT%H:%M)"
          for i in 1 2 3; do git pull --rebase -q origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done

  deploy:
    needs: [test, pipeline, e2e]
    # Nur nach grünem E2E, und genau der getestete Stand. Teilfehler der Pipeline blockieren nicht: committet wird nur, was bestanden hat
    if: always() && needs.test.result == 'success' && needs.e2e.result == 'success' && needs.pipeline.result != 'cancelled' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.e2e.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
